name: Build Mobile APK (Native)
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Select Mobile App to Build'
        required: true
        default: 'mobile-delivery'
        type: choice
        options:
          - mobile-delivery
          - mobile-customer
          - mobile-seller
          - all
  push:
    branches: ["main"]

jobs:
  build-android:
    name: Build Android Release (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-delivery, mobile-customer, mobile-seller]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == matrix.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Expo Prebuild (Ensure Native Android Project)
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://api.1handindia.com/api' }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsuMWhhbmRpbmRpYS5jb20k' }}
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/android/**/*.gradle*', matrix.app), format('apps/{0}/android/gradle/wrapper/gradle-wrapper.properties', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.app }}-

      - name: Make Gradle wrapper executable
        run: chmod +x apps/${{ matrix.app }}/android/gradlew

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 --decode > apps/${{ matrix.app }}/android/app/release.keystore
          else
            echo "ANDROID_KEYSTORE_B64 secret is not set. Skipping custom keystore setup."
          fi

      - name: Build Android APK (.apk)
        working-directory: apps/${{ matrix.app }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://api.1handindia.com/api' }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsuMWhhbmRpbmRpYS5jb20k' }}
        run: |
          if [ -f "app/release.keystore" ]; then
            KEYSTORE_PATH=$(pwd)/app/release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
              -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
          else
            echo "Warning: release.keystore not found. Building without custom signing config."
            ./gradlew assembleRelease
          fi

      - name: Upload Release APK (.apk) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk