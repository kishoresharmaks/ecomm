name: Build Mobile APK (Native)
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Select Mobile App to Build'
        required: true
        default: 'mobile-delivery'
        type: choice
        options:
          - mobile-delivery
          - mobile-customer
          - mobile-seller
          - all
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  prep-matrix:
    name: Prepare App Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          SELECTED_APP: ${{ github.event.inputs.app }}
        run: |
          case "$SELECTED_APP" in
            mobile-delivery)
              echo 'matrix={"app":["mobile-delivery"]}' >> "$GITHUB_OUTPUT"
              ;;
            mobile-customer)
              echo 'matrix={"app":["mobile-customer"]}' >> "$GITHUB_OUTPUT"
              ;;
            mobile-seller)
              echo 'matrix={"app":["mobile-seller"]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix={"app":["mobile-delivery","mobile-customer","mobile-seller"]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build-android:
    needs: prep-matrix
    name: Build Android Release (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prep-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Expo Prebuild (Ensure Native Android Project)
        working-directory: apps/${{ matrix.app }}
        env:
          RAW_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          RAW_CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          export EXPO_PUBLIC_API_URL="${RAW_API_URL:-https://api.1handindia.com/api}"
          export EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY="${RAW_CLERK_KEY:-pk_live_Y2xlcmsuMWhhbmRpbmRpYS5jb20k}"
          npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/android/**/*.gradle*', matrix.app), format('apps/{0}/android/gradle/wrapper/gradle-wrapper.properties', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.app }}-

      - name: Make Gradle wrapper executable
        run: chmod +x apps/${{ matrix.app }}/android/gradlew

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 --decode > apps/${{ matrix.app }}/android/app/release.keystore
          else
            echo "ANDROID_KEYSTORE_B64 secret is not set. Skipping custom keystore setup."
          fi

      - name: Build Android APK (.apk)
        working-directory: apps/${{ matrix.app }}/android
        env:
          RAW_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          RAW_CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          SECRET_KS_PASS_1: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KS_PASS_2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_ALIAS_1: ${{ secrets.KEY_ALIAS }}
          SECRET_ALIAS_2: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS_1: ${{ secrets.KEY_PASSWORD }}
          SECRET_KEY_PASS_2: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export EXPO_PUBLIC_API_URL="${RAW_API_URL:-https://api.1handindia.com/api}"
          export EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY="${RAW_CLERK_KEY:-pk_live_Y2xlcmsuMWhhbmRpbmRpYS5jb20k}"
          
          STORE_PASS="${SECRET_KS_PASS_1:-$SECRET_KS_PASS_2}"
          ALIAS="${SECRET_ALIAS_1:-$SECRET_ALIAS_2}"
          KEY_PASS="${SECRET_KEY_PASS_1:-$SECRET_KEY_PASS_2}"
          
          if [ -f "app/release.keystore" ] && [ -n "$STORE_PASS" ]; then
            KEYSTORE_PATH=$(pwd)/app/release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
              -Pandroid.injected.signing.store.password=$STORE_PASS \
              -Pandroid.injected.signing.key.alias=$ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASS
          else
            echo "Warning: release.keystore or keystore password not found. Building release APK without signing arguments."
            ./gradlew assembleRelease
          fi

      - name: Upload Release APK (.apk) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk