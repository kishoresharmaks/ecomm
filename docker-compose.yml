name: 1handindia

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    network_mode: "host"
    restart: always
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    network_mode: "host"
    restart: always
    environment:
      - PORT=3002
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    network_mode: "host"
    restart: always
    env_file:
      - .env
