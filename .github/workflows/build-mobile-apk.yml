name: Build Mobile APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🔑 Create credentials.json
        working-directory: apps/mobile-customer
        run: |
          echo '{
            "android": {
              "keystore": {
                "keystorePath": "@onehandindiasteam__onehandindia-customer.jks",
                "keystorePassword": "${{ secrets.KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.KEY_ALIAS }}",
                "keyPassword": "${{ secrets.KEY_PASSWORD }}"
              }
            }
          }' > credentials.json

      - name: 🚀 Build APK
        working-directory: apps/mobile-customer
        run: eas build --platform android --profile production --local
        env:
          EAS_SKIP_AUTO_FINGERPRINT: 1
          EAS_NO_VCS: 1

      - name: 📂 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1HandIndia-Customer-APK
          path: apps/mobile-customer/build-*.apk
