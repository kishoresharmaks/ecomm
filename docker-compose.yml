name: 1handindia

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    env_file:
      - .env
