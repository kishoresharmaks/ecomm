name: Build Mobile APK (Native)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Select Mobile App to Build"
        required: true
        default: "mobile-delivery"
        type: choice
        options:
          - mobile-delivery
          - mobile-customer
          - mobile-seller
          - all

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prep-matrix:
    name: Prepare App Matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Prepare build matrix
        id: set-matrix
        env:
          SELECTED_APP: ${{ github.event.inputs.app }}
        run: |
          case "$SELECTED_APP" in
            mobile-delivery)
              echo 'matrix={"app":["mobile-delivery"]}' >> "$GITHUB_OUTPUT"
              ;;
            mobile-customer)
              echo 'matrix={"app":["mobile-customer"]}' >> "$GITHUB_OUTPUT"
              ;;
            mobile-seller)
              echo 'matrix={"app":["mobile-seller"]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix={"app":["mobile-delivery","mobile-customer","mobile-seller"]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build-android:
    needs: prep-matrix

    name: Build Android Release (${{ matrix.app }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prep-matrix.outputs.matrix) }}

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Java
      # -------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # -------------------------------------------------------
      # pnpm
      # -------------------------------------------------------

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # -------------------------------------------------------
      # Node.js
      # -------------------------------------------------------

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # -------------------------------------------------------
      # Dependencies
      # -------------------------------------------------------

      - name: Install dependencies
        run: pnpm install

      # -------------------------------------------------------
      # Firebase google-services.json
      #
      # Supported secrets:
      #
      # MOBILE_CUSTOMER_GOOGLE_SERVICES_JSON
      # MOBILE_DELIVERY_GOOGLE_SERVICES_JSON
      # MOBILE_SELLER_GOOGLE_SERVICES_JSON
      #
      # Base64 versions are also supported.
      #
      # GOOGLE_SERVICES_JSON is used as a generic fallback.
      # -------------------------------------------------------

      - name: Create Firebase google-services.json
        env:
          GENERIC_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GENERIC_GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

          CUSTOMER_GOOGLE_SERVICES_JSON: ${{ secrets.MOBILE_CUSTOMER_GOOGLE_SERVICES_JSON }}
          CUSTOMER_GOOGLE_SERVICES_JSON_B64: ${{ secrets.MOBILE_CUSTOMER_GOOGLE_SERVICES_JSON_B64 }}

          DELIVERY_GOOGLE_SERVICES_JSON: ${{ secrets.MOBILE_DELIVERY_GOOGLE_SERVICES_JSON }}
          DELIVERY_GOOGLE_SERVICES_JSON_B64: ${{ secrets.MOBILE_DELIVERY_GOOGLE_SERVICES_JSON_B64 }}

          SELLER_GOOGLE_SERVICES_JSON: ${{ secrets.MOBILE_SELLER_GOOGLE_SERVICES_JSON }}
          SELLER_GOOGLE_SERVICES_JSON_B64: ${{ secrets.MOBILE_SELLER_GOOGLE_SERVICES_JSON_B64 }}

        run: |
          APP_NAME="${{ matrix.app }}"
          APP_DIR="apps/$APP_NAME"
          OUTPUT_FILE="$APP_DIR/google-services.json"

          echo "Preparing Firebase configuration for $APP_NAME..."

          CONFIG_JSON=""
          CONFIG_JSON_B64=""

          case "$APP_NAME" in

            mobile-customer)
              CONFIG_JSON="$CUSTOMER_GOOGLE_SERVICES_JSON"
              CONFIG_JSON_B64="$CUSTOMER_GOOGLE_SERVICES_JSON_B64"
              ;;

            mobile-delivery)
              CONFIG_JSON="$DELIVERY_GOOGLE_SERVICES_JSON"
              CONFIG_JSON_B64="$DELIVERY_GOOGLE_SERVICES_JSON_B64"
              ;;

            mobile-seller)
              CONFIG_JSON="$SELLER_GOOGLE_SERVICES_JSON"
              CONFIG_JSON_B64="$SELLER_GOOGLE_SERVICES_JSON_B64"
              ;;

          esac

          # Use generic secret as fallback
          CONFIG_JSON="${CONFIG_JSON:-$GENERIC_GOOGLE_SERVICES_JSON}"
          CONFIG_JSON_B64="${CONFIG_JSON_B64:-$GENERIC_GOOGLE_SERVICES_JSON_B64}"

          mkdir -p "$APP_DIR"

          if [ -n "$CONFIG_JSON_B64" ]; then

            echo "Using Base64 Firebase configuration."

            printf '%s' "$CONFIG_JSON_B64" \
              | base64 --decode \
              > "$OUTPUT_FILE"

          elif [ -n "$CONFIG_JSON" ]; then

            echo "Using JSON Firebase configuration."

            printf '%s' "$CONFIG_JSON" \
              > "$OUTPUT_FILE"

          elif [ -f "$OUTPUT_FILE" ]; then

            echo "Using existing $OUTPUT_FILE."

          elif [ -f "$APP_DIR/android/app/google-services.json" ]; then

            echo "Using existing Android Firebase configuration."

            cp \
              "$APP_DIR/android/app/google-services.json" \
              "$OUTPUT_FILE"

          else

            echo "ERROR: google-services.json was not provided for $APP_NAME."
            echo ""
            echo "Create one of these GitHub Secrets:"
            echo ""
            echo "MOBILE_CUSTOMER_GOOGLE_SERVICES_JSON"
            echo "MOBILE_DELIVERY_GOOGLE_SERVICES_JSON"
            echo "MOBILE_SELLER_GOOGLE_SERVICES_JSON"
            echo ""
            echo "Or use the generic:"
            echo ""
            echo "GOOGLE_SERVICES_JSON"
            echo ""
            exit 1

          fi

          # Verify that the file is not empty
          if [ ! -s "$OUTPUT_FILE" ]; then
            echo "ERROR: $OUTPUT_FILE is empty."
            exit 1
          fi

          # Validate JSON without printing secret contents
          node -e "
            const fs = require('fs');
            const file = process.argv[1];

            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log('google-services.json is valid JSON.');
            } catch (error) {
              console.error('ERROR: google-services.json contains invalid JSON.');
              process.exit(1);
            }
          " "$OUTPUT_FILE"

      # -------------------------------------------------------
      # Expo Prebuild
      # -------------------------------------------------------

      - name: Expo Prebuild (Ensure Native Android Project)
        working-directory: apps/${{ matrix.app }}

        env:
          RAW_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          RAW_CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}

        run: |
          export EXPO_PUBLIC_API_URL="${RAW_API_URL:-https://api.1handindia.com/api}"
          export EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY="${RAW_CLERK_KEY:-pk_live_Y2xlcmsuMWhhbmRpbmRpYS5jb20k}"

          npx expo prebuild \
            --platform android \
            --no-install

      # -------------------------------------------------------
      # Explicitly install google-services.json into Android
      #
      # This guarantees Gradle can find:
      #
      # android/app/google-services.json
      # -------------------------------------------------------

      - name: Install Firebase config into Android project
        run: |
          APP_DIR="apps/${{ matrix.app }}"

          SOURCE_FILE="$APP_DIR/google-services.json"
          TARGET_FILE="$APP_DIR/android/app/google-services.json"

          if [ ! -s "$SOURCE_FILE" ]; then
            echo "ERROR: Firebase source configuration is missing."
            echo "Expected:"
            echo "$SOURCE_FILE"
            exit 1
          fi

          mkdir -p "$APP_DIR/android/app"

          cp "$SOURCE_FILE" "$TARGET_FILE"

          echo "Firebase configuration installed successfully."

      # -------------------------------------------------------
      # Final Firebase verification
      # -------------------------------------------------------

      - name: Verify Android Firebase configuration
        run: |
          FIREBASE_FILE="apps/${{ matrix.app }}/android/app/google-services.json"

          echo "Checking Firebase configuration..."

          if [ ! -f "$FIREBASE_FILE" ]; then
            echo "ERROR: google-services.json does not exist."
            echo ""
            echo "Expected location:"
            echo "$FIREBASE_FILE"
            exit 1
          fi

          if [ ! -s "$FIREBASE_FILE" ]; then
            echo "ERROR: google-services.json is empty."
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const file = process.argv[1];

            try {
              const config = JSON.parse(
                fs.readFileSync(file, 'utf8')
              );

              if (!config.project_info) {
                throw new Error(
                  'project_info is missing'
                );
              }

              if (
                !config.client ||
                !Array.isArray(config.client) ||
                config.client.length === 0
              ) {
                throw new Error(
                  'Firebase client configuration is missing'
                );
              }

              console.log(
                'Firebase Android configuration verified successfully.'
              );

            } catch (error) {

              console.error(
                'ERROR:',
                error.message
              );

              process.exit(1);
            }
          " "$FIREBASE_FILE"

      # -------------------------------------------------------
      # Gradle Cache
      # -------------------------------------------------------

      - name: Cache Gradle
        uses: actions/cache@v4

        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

          key: >-
            ${{ runner.os }}-gradle-${{ matrix.app }}-${{
              hashFiles(
                format(
                  'apps/{0}/android/**/*.gradle*',
                  matrix.app
                ),
                format(
                  'apps/{0}/android/gradle/wrapper/gradle-wrapper.properties',
                  matrix.app
                )
              )
            }}

          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.app }}-

      # -------------------------------------------------------
      # Gradle permissions
      # -------------------------------------------------------

      - name: Make Gradle wrapper executable
        run: |
          chmod +x \
            apps/${{ matrix.app }}/android/gradlew

      # -------------------------------------------------------
      # Android Release Keystore
      # -------------------------------------------------------

      - name: Decode Keystore

        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then

            echo "$ANDROID_KEYSTORE_B64" \
              | base64 --decode \
              > apps/${{ matrix.app }}/android/app/release.keystore

            echo "Release keystore created."

          else

            echo "ANDROID_KEYSTORE_B64 is not configured."
            echo "Continuing without custom keystore."

          fi

      # -------------------------------------------------------
      # Build Release APK
      # -------------------------------------------------------

      - name: Build Android APK (.apk)

        working-directory: apps/${{ matrix.app }}/android

        env:
          RAW_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          RAW_CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}

          SECRET_KS_PASS_1: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KS_PASS_2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

          SECRET_ALIAS_1: ${{ secrets.KEY_ALIAS }}
          SECRET_ALIAS_2: ${{ secrets.ANDROID_KEY_ALIAS }}

          SECRET_KEY_PASS_1: ${{ secrets.KEY_PASSWORD }}
          SECRET_KEY_PASS_2: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |
          export EXPO_PUBLIC_API_URL="${RAW_API_URL:-https://api.1handindia.com/api}"
          export EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY="${RAW_CLERK_KEY:-pk_live_Y2xlcmsuMWhhbmRpbmRpYS5jb20k}"

          STORE_PASS="${SECRET_KS_PASS_1:-$SECRET_KS_PASS_2}"
          ALIAS="${SECRET_ALIAS_1:-$SECRET_ALIAS_2}"
          KEY_PASS="${SECRET_KEY_PASS_1:-$SECRET_KEY_PASS_2}"

          if \
            [ -f "app/release.keystore" ] && \
            [ -n "$STORE_PASS" ] && \
            [ -n "$ALIAS" ] && \
            [ -n "$KEY_PASS" ]
          then

            echo "Building signed release APK..."

            KEYSTORE_PATH="$(pwd)/app/release.keystore"

            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"

          else

            echo "Custom signing configuration is incomplete."
            echo "Building release APK using the project's configured signing."

            ./gradlew assembleRelease

          fi

      # -------------------------------------------------------
      # Locate APK
      # -------------------------------------------------------

      - name: Verify Release APK
        run: |
          APK_FILE="apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_FILE" ]; then

            echo "ERROR: Release APK was not generated."

            echo "Available APK files:"

            find \
              "apps/${{ matrix.app }}/android/app/build/outputs" \
              -type f \
              -name "*.apk" \
              2>/dev/null || true

            exit 1

          fi

          echo "Release APK generated successfully."

          ls -lh "$APK_FILE"

      # -------------------------------------------------------
      # Upload APK
      # -------------------------------------------------------

      - name: Upload Release APK (.apk) Artifact

        uses: actions/upload-artifact@v4

        with:
          name: ${{ matrix.app }}-release-apk

          path: >-
            apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk

          if-no-files-found: error

          retention-days: 14
