# 1HandIndia Next.js upstream and server configuration
# Deploy location: /etc/nginx/sites-available/indihub-nextjs

upstream nextjs_upstream {
  server 127.0.0.1:3000;
  keepalive 64;
}

upstream indihub_api_upstream {
  server 127.0.0.1:4000;
  keepalive 64;
}

server {
  listen 80;
  server_name 1handindia.com www.1handindia.com;
  
  # Redirect HTTP to HTTPS
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name 1handindia.com www.1handindia.com;

  # SSL certificates (update paths to actual certificate locations)
  ssl_certificate /etc/ssl/certs/1handindia.com.crt;
  ssl_certificate_key /etc/ssl/private/1handindia.com.key;
  
  # SSL best practices
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json;
  gzip_min_length 1000;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Next.js static file handling (critical for _next/static/)
  location /_next/static/ {
    # Cache static files aggressively (they have content hashes)
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    
    # Map /_next/static/* to apps/web/.next/static/*.
    alias /var/www/indihub/ecomm/apps/web/.next/static/;
    try_files $uri =404;
  }

  # Public static files (favicon, robots.txt, etc.)
  location /public/ {
    root /var/www/indihub/ecomm/apps/web;
    expires 7d;
    add_header Cache-Control "public";
  }

  # API routes - proxy to Node.js
  location /api/ {
    proxy_pass http://indihub_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # WebSocket support (for real-time features like socket.io)
  location /socket.io/ {
    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Main app - proxy everything else to Next.js
  location / {
    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;
  }

  # Fallback for static files
  @nextjs {
    proxy_pass http://nextjs_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
  }

  location ~ ~$ {
    deny all;
  }

  # Client max body size for uploads (adjust as needed)
  client_max_body_size 100M;

  # Access logs
  access_log /var/log/nginx/1handindia-access.log;
  error_log /var/log/nginx/1handindia-error.log;
}
