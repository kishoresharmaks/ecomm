name: EAS Build (Android)

# Builds signed Android binaries on EAS servers using the onehandindiasteam
# Expo account. Credentials (keystore, FCM key, GOOGLE_SERVICES_JSON) live on
# EAS, so this workflow needs only one secret: EXPO_TOKEN.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Mobile app to build"
        required: true
        default: "mobile-delivery"
        type: choice
        options:
          - mobile-delivery
          - mobile-customer
          - mobile-seller
          - all
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: read

jobs:
  prep-matrix:
    name: Prepare App Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Prepare build matrix
        id: set-matrix
        env:
          SELECTED_APP: ${{ github.event.inputs.app }}
        run: |
          if [ "$SELECTED_APP" = "all" ]; then
            echo 'matrix={"app":["mobile-delivery","mobile-customer","mobile-seller"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"app\":[\"$SELECTED_APP\"]}" >> "$GITHUB_OUTPUT"
          fi

  eas-build:
    needs: prep-matrix
    name: EAS Build (${{ matrix.app }}, ${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prep-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/${{ matrix.app }}..."

      - name: Verify seller release inputs
        if: matrix.app == 'mobile-seller'
        env:
          RAW_CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          export EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY="${RAW_CLERK_KEY:-pk_live_Y2xlcmsuMWhhbmRpbmRpYS5jb20k}"

          pnpm --filter @indihub/mobile-seller typecheck
          pnpm --filter @indihub/mobile-seller lint
          pnpm --filter @indihub/mobile-seller test

          cd apps/mobile-seller
          npx expo install --check
          npx expo-doctor
          npx expo config --type public --json > "$RUNNER_TEMP/mobile-seller-expo-config.json"

          node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/mobile-seller-expo-config.json", "utf8"),
          );
          const android = config.android ?? {};

          if (android.package !== "com.onehandindia.seller") {
            throw new Error(`Unexpected Android package: ${android.package ?? "missing"}`);
          }
          if (config.version !== "1.0.0") {
            throw new Error(`Unexpected app version: ${config.version ?? "missing"}`);
          }
          if (android.allowBackup !== false) {
            throw new Error("Android backup must remain disabled.");
          }
          if (config.extra?.eas?.projectId !== "e017cb61-41d7-4e0f-9268-573106ddd729") {
            throw new Error(`Unexpected Expo EAS project ID: ${config.extra?.eas?.projectId ?? "missing"}`);
          }

          console.log("Seller Expo release config verified.");
          NODE

      - name: Trigger EAS build
        working-directory: apps/${{ matrix.app }}
        run: |
          eas build \
            --platform android \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive \
            --wait

      # The workflow waits for the EAS result so a green GitHub Action means
      # the remote Android build completed successfully.
