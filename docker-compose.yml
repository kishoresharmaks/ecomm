name: 1handindia

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    network_mode: "host"
    restart: always
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.1handindia.com}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-https://1handindia.com}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-30000}
    network_mode: "host"
    restart: always
    environment:
      - PORT=3002
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    network_mode: "host"
    restart: always
    env_file:
      - .env
