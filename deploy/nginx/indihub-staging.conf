# 1HandIndia Staging Nginx Server Configuration
# Web Frontend: Port 3002
# API Backend: Port 4000
# Deploy location: /etc/nginx/sites-available/indihub-staging

upstream nextjs_staging_upstream {
  server 127.0.0.1:3002;
  keepalive 64;
}

upstream indihub_api_staging_upstream {
  server 127.0.0.1:4000;
  keepalive 64;
}

server {
  listen 80;
  server_name staging.1handindia.com;

  # Redirect HTTP to HTTPS (or remove if using HTTP only on staging IP)
  # return 301 https://$server_name$request_uri;

  # Baseline browser security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json;
  gzip_min_length 1000;

  # Next.js static file handling (critical for _next/static/)
  location /_next/static/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    alias /var/www/indihub/ecomm/apps/web/.next/static/;
    try_files $uri =404;
  }

  # API routes -> NestJS Backend on port 4000
  location /api/ {
    proxy_pass http://indihub_api_staging_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # WebSocket support -> Next.js on port 3002
  location /socket.io/ {
    proxy_pass http://nextjs_staging_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Main Web App -> Next.js on port 3002
  location / {
    proxy_pass http://nextjs_staging_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_cache_bypass $http_upgrade;
  }

  # Deny access to hidden files
  location ~ /\. {
    deny all;
  }

  # Client max body size for uploads
  client_max_body_size 100M;

  # Access and error logs
  access_log /var/log/nginx/indihub-staging-access.log;
  error_log /var/log/nginx/indihub-staging-error.log;
}
